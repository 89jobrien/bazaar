[package]
name = "bazaar-gen"
version = "0.4.0"
edition = "2024"
authors = ["Joseph O'Brien"]
description = "bz -- generates the bazaar showcase site (index.html, profile page, README) from GitHub, crates.io, PyPI, and Claude Code plugin sources"
license = "MIT OR Apache-2.0"
repository = "https://github.com/89jobrien/bazaar"
keywords = ["showcase", "portfolio", "generator"]
categories = ["command-line-utilities"]

[[bin]]
name = "bz"
path = "src/main.rs"

[dependencies]
bazaar-types = { path = "../bazaar-types" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
askama = "0.12"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indexmap = "2"
base64 = "0.22"
async-trait = "0.1"
futures = "0.3"
obfsck = { git = "https://github.com/89jobrien/obfsck" }

tempfile = "3"

[dev-dependencies]
serial_test = "3"
