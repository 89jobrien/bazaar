  readme: |-
    # trace::

    > a programming language where reasoning is first-class

    In most languages, values are first-class. In `trace::`, _reasoning provenance_ is
    first-class. Every computation returns `Trace<T>` — a value enriched with the full
    causal chain of how it was produced: steps taken, branches considered and rejected,
    confidence at each decision point, and RAII-style span timing.

    This repository contains the `trace::` language design and a Rust reference
    implementation of its core types, all of which compile and are usable today.

    ---

    ## crates

    | crate              | description                                                     | docs |
    | ------------------ | ---------------------------------------------------------------- | --- |
    | `trace-lang-core`     | `Trace<T>`, `Step`, `Span`, `Branch`, `TraceErr`                | [README](crates/core/README.md) |
    | `trace-lang-task`     | `Task`, `TaskStatus`, `Priority`, `TaskRegistry`                | [README](crates/task/README.md) |
    | `trace-lang-agent`    | `Agent` trait, `spawn`/`delegate`, lifecycle escalation hooks   | [README](crates/agent/README.md) |
    | `trace-lang-runtime`  | `AgentRegistry`, `run_with_escalation`, `join_all`, `speculate` | [README](crates/runtime/README.md) |

    `trace-lang-core` has no dependency on any other crate in the workspace; the
    dependency graph flows `core -> task`, `core -> agent -> runtime`.

    ---

    ## the mental model

    ```rust
    // in Rust you might write:
    fn answer(q: Question) -> Answer { .. }

    // in trace:: every computation is inspectable:
    step answer(q: Question) -> Trace<Answer> { .. }

    // and you can interrogate the result:
    let t = spawn MyAgent::answer(q).await
    t.causal_chain()       // how did we get here?
    t.rejected_branches()  // what did we consider and discard?
    t.bottlenecks()        // where did we slow down?
    t.low_confidence()     // where were we uncertain?
    ```

