  readme: |-
    # propkit

    `propkit` is an experimental Rust property-based testing toolkit. The workspace combines:

    - a library of reusable `proptest` strategies and helper types; and
    - a `propkit` CLI that scans Rust source, recommends likely properties, generates standalone test
      files, and scaffolds VM-oriented test helpers.

    The workspace is version `0.0.1` and uses Rust 2024. Its APIs and generated output should be treated
    as early-stage: inspect generated tests before adopting them and pin the source revision when using
    the library from another project.

    ## Implementation status

    The reusable library currently exposes four modules with the `strategies` Cargo feature: `floats`,
    `permutations`, `recursive`, and `slices`. The Cargo features `complex`, `chrono`, `regex`, and
    `uuid` expose the modules `complex`, `datetimes`, `regex_props`, and `uuids`, respectively.

    The repository also has integration property suites for collections, strings, numerics, sampling,
    and composition. Those are test coverage in this repository, not currently public strategy modules.

    The CLI implements `scan`, `generate`, and two `scaffold` variants. `generate --append` and
    `generate --exclude` are accepted by Clap but are not applied by the current command handler. The
    confidence filter and output path are implemented.

    ## Workspace layout

    | Path                                      | Role                                                  |
    | ----------------------------------------- | ----------------------------------------------------- |
    | `propkit/src/strategies`                  | Feature-gated reusable strategies and helper types.   |
    | `propkit/tests`                           | Domain property suites and public API checks.         |
    | `propkit-cli/src/analyzer.rs`             | `syn` visitor and property recommendation heuristics. |
    | `propkit-cli/src/generators/property.rs`  | Standalone `proptest` file generation.                |
    | `propkit-cli/src/generators/smolvm.rs`    | smolvm helpe
