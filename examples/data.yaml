  readme: |
    # pick

    A Rust port of [mptre/pick](https://github.com/mptre/pick) — a fuzzy list
    selector for terminals. Reads newline-delimited choices from stdin, lets you
    interactively fuzzy-filter and select one, and prints the selection to
    stdout.

    ```sh
    ls | pick
    git branch | pick -q main
    ```

    ## Usage

    ```text
    pick [-dKoSXx] [-q query]
    ```

    - `-d` — treat the first IFS-separated field of each line as a description,
      shown alongside (but not matched/output unless `-o` is given)
    - `-o` — also print the description of the selected choice
    - `-q query` — seed the initial query
    - `-S` — disable score-based sorting (also toggleable at runtime with
      `Ctrl+O`)
    - `-x` / `-X` — force enable/disable the terminal alternate screen
    - `-K` — accepted for CLI compatibility; keypad handling is delegated to the
      terminal backend and has no separate effect here

    ## Keybindings

    Same as upstream pick: arrow keys / `Ctrl+N`/`Ctrl+P`/`Ctrl+F`/`Ctrl+B` to
    move, `Ctrl+A`/`Ctrl+E` for line start/end, `Ctrl+U`/`Ctrl+K`/`Ctrl+W` to kill
    text, `PageUp`/`PageDown`/`Home`/`End` to scroll, `Enter` to select,
    `Alt+Enter` to submit the literal query text, `Ctrl+C` to cancel.

    ## Differences from upstream

    - Terminal handling uses [crossterm](https://docs.rs/crossterm) rather than
      raw termios/terminfo, with crossterm's `use-dev-tty` feature so keyboard
      input still comes from the controlling terminal even when stdin is a pipe
      of choices.
    - `Ctrl+Z` (suspend) is a no-op rather than sending `SIGTSTP`.
    - The "only re-filter choices added since last keystroke" performance
      optimization from the C implementation is not replicated; every keystroke
      re-filters the full choice list.
